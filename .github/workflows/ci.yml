name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.dependencies }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['12', '13']
        dependencies: [lowest, highest]
        include:
          - laravel: '12'
            testbench: '^10.0'
          - laravel: '13'
            testbench: '^11.0'

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, dom, fileinfo, filter, mbstring, openssl, tokenizer, xml, xmlwriter
          tools: composer:v2
          coverage: none

      - name: Resolve the selected supported dependency combination
        run: >-
          composer update
          --with="laravel/framework:^${{ matrix.laravel }}.0"
          --with="orchestra/testbench:${{ matrix.testbench }}"
          --prefer-stable --prefer-dist --no-interaction --no-progress
          ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }}

      - run: composer validate --strict
      - run: composer check-platform-reqs
      - run: composer test
      - run: composer lint
      - run: composer analyse
